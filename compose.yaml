name: hmcts-task-management

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hmcts_tasks}
      POSTGRES_USER: ${POSTGRES_USER:-hmcts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hmcts_local_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hmcts} -d ${POSTGRES_DB:-hmcts_tasks}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hmcts_tasks}
      DB_USERNAME: ${POSTGRES_USER:-hmcts}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-hmcts_local_password}
      ALLOWED_ORIGINS: http://localhost:3100,http://localhost:5173
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/v3/api-docs"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:3100:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
