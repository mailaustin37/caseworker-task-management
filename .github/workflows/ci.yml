name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Test backend
        working-directory: backend
        run: mvn --batch-mode clean verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  application-smoke-test:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Start the application
        run: docker compose up --build --detach --wait frontend
      - name: Verify the interface and API
        run: |
          curl --fail --retry 5 --retry-connrefused http://127.0.0.1:3100/tasks
          curl --fail --retry 5 --retry-connrefused http://127.0.0.1:3100/api/tasks
      - name: Stop the application
        if: always()
        run: docker compose down --volumes
